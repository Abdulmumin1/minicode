<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Mode Sandbox</title>
  <style>
    :root { --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee; --dim: #8a93a6; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --accent: #60a5fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0 auto 0 0; }
    select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
    button.run { background: var(--accent); color: #0b1220; border: 0; font-weight: 600; cursor: pointer; }
    button.run:disabled { opacity: .6; cursor: wait; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); height: calc(100vh - 57px); }
    section { background: var(--bg); overflow: auto; padding: 12px 16px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 16px 0 6px; }
    h2:first-child { margin-top: 0; }
    textarea { width: 100%; height: 60vh; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; tab-size: 2; }
    pre { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .dim { color: var(--dim); }
    .tool { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .tool code { color: var(--accent); }
    .hint { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Code Mode Sandbox</h1>
    <select id="examples"></select>
    <button class="run" id="run">Run ⌘↵</button>
  </header>
  <main>
    <section>
      <h2>Your code</h2>
      <textarea id="code" spellcheck="false"></textarea>
      <p class="hint">Available inside: <code>tools.*</code>, <code>search()</code>, <code>console</code>, <code>fetch</code> (api.github.com only). Use <code>await</code> and <code>return</code>.</p>
      <h2>Tool catalog</h2>
      <div id="catalog"></div>
    </section>
    <section>
      <h2>Status</h2>
      <pre id="status" class="dim">Not run yet</pre>
      <h2>Result</h2>
      <pre id="result"></pre>
      <h2>Console</h2>
      <pre id="logs"></pre>
      <h2>Tool calls</h2>
      <pre id="calls"></pre>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

    fetch("/api/catalog").then((r) => r.json()).then((tools) => {
      $("catalog").innerHTML = tools.map((t) =>
        `<div class="tool"><code>${esc(t.path)}</code> <span class="dim">${esc(t.signature)}</span><br>${esc(t.description)}</div>`
      ).join("");
    });

    fetch("/api/examples").then((r) => r.json()).then((examples) => {
      $("examples").innerHTML = examples.map((e, i) => `<option value="${i}">${esc(e.name)}</option>`).join("");
      $("examples").onchange = () => { $("code").value = examples[$("examples").value].code; };
      $("code").value = examples[0]?.code ?? "";
    });

    async function run() {
      $("run").disabled = true;
      $("status").className = "dim";
      $("status").textContent = "Running…";
      const out = await fetch("/api/run", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: $("code").value }),
      }).then((r) => r.json());
      $("run").disabled = false;

      $("status").className = out.ok ? "ok" : "bad";
      $("status").textContent = `${out.ok ? "✓ Success" : "✗ Failed"} in ${out.ms}ms`;
      $("result").innerHTML = out.ok
        ? esc(out.result === undefined ? "undefined" : JSON.stringify(out.result, null, 2))
        : `<span class="bad">${esc(out.error)}</span>`;
      $("logs").innerHTML = out.logs.map((l) =>
        `<span class="${l.level === "log" ? "" : l.level === "warn" ? "warn" : "bad"}">${esc(l.text)}</span>`
      ).join("\n") || '<span class="dim">(nothing logged)</span>';
      $("calls").innerHTML = out.calls.map((c) =>
        `<span class="${c.ok ? "ok" : "bad"}">${c.ok ? "✓" : "✗"}</span> ${esc(c.path)}(${esc(JSON.stringify(c.args))}) <span class="dim">${c.ms ?? "?"}ms</span>${c.ok ? "" : ` <span class="bad">${esc(c.error)}</span>`}`
      ).join("\n") || '<span class="dim">(no tool calls)</span>';
    }

    $("run").onclick = run;
    $("code").addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
      if (e.key === "Tab") {
        e.preventDefault();
        const t = e.target, s = t.selectionStart;
        t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
        t.selectionStart = t.selectionEnd = s + 2;
      }
    });
  </script>
</body>
</html>
